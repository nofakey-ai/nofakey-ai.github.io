name: Update blog listings, sitemap, RSS & llms.txt

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so per-file publish dates can be read

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run site builder
        run: python3 scripts/build_site.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update blog listing, sitemap, RSS & llms.txt [skip ci]"
          file_pattern: "index.html blog.html sitemap.xml sitemap.html rss.xml llms.txt"
